  opening: Szia, megjött a Yettel TV-box, hogyan kössem be a tévéhez?
  success: ["HDMI-kábeles csatlakoztatás a TV-hez", "csatlakozás a routerhez WiFi-n vagy kábellel", "távirányító párosítása"]
