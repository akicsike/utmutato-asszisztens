# 3. szint – alkalmazás-szintű mérés: összetett, többfordulós felhasználói utak (szimulált felhasználóval).
# A szimulált felhasználó a persona és a cél alapján kérdez tovább; ha a célja teljesült: [KÉSZ], ha nem jut
# előre: [FELADOM]. A `success` a cél teljesülésének ellenőrizhető elemei (az LLM-bíró ehhez méri).

- id: j01
  persona: Idős, nem túl technikás nyugdíjas, rövid mondatokban ír.
  goal: Vízkőteleníteni akarja a JURA Impressa S9 kávégépét, és tudni akarja, meddig tart a folyamat.
  opening: Jó napot! A JURA S9 kávéfőzőm azt írja ki, hogy vízkőtelenítsek. Hogyan kell?
  success: ["a vízkőtelenítés lépései", "az eljárás időtartama (kb. 35-45 perc)"]
  max_turns: 4
- id: j02
  persona: Siető kisgyerekes szülő, a mosogatógép nem mos tisztán.
  goal: Megtudni, hogyan kell kitisztítani a Bosch SMV41D10EU mosogatógép szűrőit.
  opening: A Bosch mosogatóm után koszosak maradnak a tányérok, mit csináljak?
  success: ["a szűrőrendszer kiszerelése és tisztítása", "visszaszerelés"]
  max_turns: 4
- id: j03
  persona: 10 éves gyerek apukája, most bontotta ki az RC Cheetah autót.
  goal: Első használat – akkumulátor feltöltése, behelyezése az autóba, és elem a távirányítóba.
  opening: Most vettük az RC Cheetah autót. Hogy kell feltölteni az aksit?
  success: ["töltés USB kábellel, LED jelzés", "akkumulátor behelyezése az autó alján csavarhúzóval", "2 db AA elem a távirányítóba"]
  max_turns: 5
